name: Snake

# Redraws the contribution snake every day and pushes it to the `output` branch.
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?color_snake=#F2B544&color_dots=#16223A,#1E4A7A,#2C6FB0,#45A3E6,#5CC8FF
            dist/snake-light.svg?color_snake=#D08A00&color_dots=#EBEDF0,#BFDDF5,#7DB9EA,#3D8FD6,#1F5FA3

      - name: Push to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
